{% extends "base.html" %}

{% block content %}
  <div class="form-card">
  <h2 class="h4">Are you sure you want to delete "{{ object.title }}"?</h2>
  <p class="text-muted">This action cannot be undone.</p>
  <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'item_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
  </div>
{% endblock %}
