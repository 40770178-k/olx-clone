{% extends 'base.html' %}
{% block title %}Mark as Shipped{% endblock %}
{% block content %}
<div class="form-card">
    <h1 class="h4">Mark Item as Shipped</h1>
    <p class="text-muted">Confirm shipment to update this escrow transaction.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Confirm Shipment</button>
    </form>
</div>
{% endblock %}
